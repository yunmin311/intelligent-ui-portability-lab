<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PagePort · 无法在此页面保存</title>
<style>
 body{margin:0;min-height:100vh;display:grid;place-items:center;font:15px/1.7 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#f4f6fa;color:#243141}
 .card{max-width:520px;margin:24px;background:#fff;border:1px solid #e2e8f2;border-radius:16px;padding:34px 38px;box-shadow:0 16px 44px rgba(24,40,70,.1)}
 .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#ffc95e,#f59e0b);position:relative;margin-bottom:16px}
 .logo::after{content:"";position:absolute;inset:10px 10px 8px;border:2px solid rgba(28,21,3,.85);border-top:none;border-radius:0 0 5px 5px}
 h1{font-size:19px;margin:0 0 10px;font-weight:650}
 p{margin:0 0 12px;color:#51637b}
 ol{margin:0 0 16px;padding-left:22px;color:#51637b}
 li{margin:6px 0}
 kbd{background:#eef2f8;border:1px solid #d8e0ee;border-radius:5px;padding:1px 6px;font:inherit;font-size:12.5px}
 .dim{font-size:12.5px;color:#8a99ad}
</style>
</head>
<body>
<div class="card">
 <div class="logo"></div>
 <h1>这个页面无法启动保存面板</h1>
 <p>浏览器内部页面（如设置页、新标签页、应用商店）不允许扩展注入内容。</p>
 <ol>
  <li>打开任意普通网页（如一篇新闻、文档或 <b>chatgpt.com</b> 的对话）</li>
  <li>再点击工具栏上的 PagePort 图标</li>
  <li>点击页面元素即可保存为 Markdown / PNG / HTML</li>
 </ol>
 <p id="why" class="dim"></p>
 <p class="dim">提示：对 <b>file://</b> 本地文件，需先在 扩展详情 → 允许访问文件网址 中开启开关。</p>
</div>
<script>
 const q = new URLSearchParams(location.search);
 const err = q.get('error'), from = q.get('from');
 document.getElementById('why').textContent = err ? ('技术原因：' + err) : (from ? ('受限地址：' + from) : '');
</script>
</body>
</html>
