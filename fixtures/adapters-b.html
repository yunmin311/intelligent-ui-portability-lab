<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>受控组件 b</title><style>*{box-sizing:border-box}body{font:15px/1.5 system-ui,sans-serif;margin:0;padding:24px;background:#f4f6f8;color:#20242a}main{width:min(820px,100%);display:grid;gap:14px}.component,details{background:#fff;padding:18px;border:1px solid #cad1db;border-radius:6px}h1{font-size:22px;margin:0}h2{font-size:17px;margin:0 0 12px}p{margin:12px 0}label{display:inline-flex;align-items:center;gap:8px;margin:6px 16px 6px 0}button,input{font:inherit;padding:7px;border:1px solid #9aa6b2;border-radius:4px;background:transparent;color:inherit}input[type=number]{width:100px}button[aria-selected=true]{background:#e6edf9;color:#153f80}output{display:block;font-size:20px;font-variant-numeric:tabular-nums}[hidden]{display:none!important}.wrapper{display:flex;flex-direction:column;gap:8px}@media(prefers-color-scheme:dark){body{background:#181b20;color:#e5e9ef}.component,details{background:#252a32;border-color:#58616e}button[aria-selected=true]{background:#324b70;color:#e0edff}}</style><main id="adapters"><h1>受控组件 · 结构 B</h1><section class="component" data-uip-recipe="tabs@1"><h2>标签 1</h2><div class="wrapper"><div><div role="tablist"><button role="tab" id="t10" aria-controls="p10" aria-selected="false" tabindex="-1" data-uip-role="tab">概览</button><button role="tab" id="t11" aria-controls="p11" aria-selected="true" tabindex="0" data-uip-role="tab">数据</button></div></div></div><div class="wrapper"><div><div id="p10" role="tabpanel" aria-labelledby="t10" aria-hidden="true" data-uip-role="panel" hidden><p>初始概览内容</p></div><div id="p11" role="tabpanel" aria-labelledby="t11" aria-hidden="false" data-uip-role="panel" ><p>中文数据 · 当前面板</p></div></div></div></section><section class="component" data-uip-recipe="tabs@1"><h2>标签 2</h2><div class="wrapper"><div><div role="tablist"><button role="tab" id="t20" aria-controls="p20" aria-selected="false" tabindex="-1" data-uip-role="tab">概览</button><button role="tab" id="t21" aria-controls="p21" aria-selected="true" tabindex="0" data-uip-role="tab">数据</button></div></div></div><div class="wrapper"><div><div id="p20" role="tabpanel" aria-labelledby="t20" aria-hidden="true" data-uip-role="panel" hidden><p>初始概览内容</p></div><div id="p21" role="tabpanel" aria-labelledby="t21" aria-hidden="false" data-uip-role="panel" ><p>中文数据 · 当前面板</p></div></div></div></section><section class="component" data-uip-recipe="calculator@1"><h2>计算 1</h2><div class="wrapper"><div><label>left<input type="number" min="-100" max="100" step="0.01" value="1.25" data-uip-role="left"></label><label>right<input type="number" min="-100" max="100" step="0.01" value="2.5" data-uip-role="right"></label></div></div><div class="wrapper"><div><output data-uip-role="output">3.75</output></div></div></section><section class="component" data-uip-recipe="state@1"><h2>状态 1</h2><div class="wrapper"><div><label><input type="checkbox" checked data-uip-role="control">显示详情</label></div></div><div class="wrapper"><div><div data-uip-role="panel" aria-hidden="true" hidden><p>简洁内容</p></div><div data-uip-role="panel" aria-hidden="false"><p>完整内容与当前状态</p></div></div></div></section><details><summary>参数说明</summary><section class="component" data-uip-recipe="calculator@1"><h2>计算 2</h2><div class="wrapper"><div><label>left<input type="number" min="-100" max="100" step="0.01" value="1.25" data-uip-role="left"></label><label>right<input type="number" min="-100" max="100" step="0.01" value="2.5" data-uip-role="right"></label></div></div><div class="wrapper"><div><output data-uip-role="output">3.75</output></div></div></section></details><section class="component"><h2>未知控件</h2><button>联网业务（不恢复）</button></section></main><script>for(const root of document.querySelectorAll('[data-uip-recipe]')){const recipe=root.dataset.uipRecipe;const roles=k=>[...root.querySelectorAll('[data-uip-role="'+k+'"]')].filter(e=>e.closest('[data-uip-recipe]')===root);if(recipe==='tabs@1'){const tabs=roles('tab'),panels=roles('panel');const select=i=>{tabs.forEach((t,n)=>{t.setAttribute('aria-selected',String(n===i));t.tabIndex=n===i?0:-1;});panels.forEach((p,n)=>{p.hidden=n!==i;p.setAttribute('aria-hidden',String(n!==i));});};tabs.forEach((t,i)=>{t.onclick=()=>select(i);t.onkeydown=e=>{let n=e.key==='ArrowRight'?(i+1)%tabs.length:e.key==='ArrowLeft'?(i+tabs.length-1)%tabs.length:e.key==='Home'?0:e.key==='End'?tabs.length-1:null;if(n!==null){e.preventDefault();select(n);tabs[n].focus();}};});}if(recipe==='calculator@1'){const [a]=roles('left'),[b]=roles('right'),[o]=roles('output');const run=()=>{if(a.checkValidity()&&b.checkValidity()&&a.value!==''&&b.value!=='')o.textContent=String(Number((Number(a.value)+Number(b.value)).toFixed(2)));};a.oninput=b.oninput=run;}if(recipe==='state@1'){const [c]=roles('control'),ps=roles('panel');c.onchange=()=>ps.forEach((p,i)=>{p.hidden=i!==Number(c.checked);p.setAttribute('aria-hidden',String(p.hidden));});}}</script></html>
