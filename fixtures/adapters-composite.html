<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>受控组合组件</title><style>
body{margin:24px;background:#f5f6f8;color:#202124;font:15px/1.5 system-ui}main{width:680px;display:grid;gap:16px}section{padding:16px;background:#fff;border:1px solid #bbb;border-radius:6px;box-sizing:border-box;width:680px}h2{margin:0 0 8px;font-size:18px}label{display:inline-flex;align-items:center;gap:6px;margin-right:12px}input{width:110px}svg{display:block;width:600px;height:180px}output{display:block;font:14px/1.5 monospace;min-height:21px}table{border-collapse:collapse;width:100%;table-layout:fixed}td,th{padding:6px;border:1px solid #aaa;text-align:left}button{font:inherit;padding:4px 8px}details{margin-top:8px}tr[hidden]{display:none!important}@media(prefers-color-scheme:dark){body{background:#202124;color:#eee}section{background:#292a2d;border-color:#777}button,input{color-scheme:dark}}

[hidden]{display:none!important}button[aria-selected=true]{background:#dbe9ff;color:#153f80}</style><body><main id="composites"><h1>组合组件 · 独立面板作用域</h1>
<section id="chart-tabs" data-uip-recipe="tabs@1"><h2>标签内的傅里叶图</h2><div role="tablist"><button id="chart-tab" role="tab" data-uip-role="tab" aria-controls="chart-panel" aria-selected="true" tabindex="0">曲线</button><button id="note-tab" role="tab" data-uip-role="tab" aria-controls="note-panel" aria-selected="false" tabindex="-1">说明</button></div><div id="chart-panel" role="tabpanel" aria-labelledby="chart-tab" data-uip-role="panel" aria-hidden="false"><section id="fourier" data-uip-recipe="fourier@1"><h2>傅里叶级数 · 自有公式 v1</h2><label>N <input data-uip-role="harmonics" type="range" min="1" max="12" step="1" value="3"></label><label>A <input data-uip-role="amplitude" type="range" min="0" max="1.5" step="0.1" value="1"></label><label>φ <input data-uip-role="phase" type="range" min="-3.14" max="3.14" step="0.01" value="0"></label><svg viewBox="0 0 600 180"><path d="M0 90H600M0 0V180" stroke="#888" fill="none"></path><path data-uip-role="curve" stroke="#2878d0" stroke-width="2" fill="none"></path></svg><output data-uip-role="output"></output></section>
</div><div id="note-panel" role="tabpanel" aria-labelledby="note-tab" data-uip-role="panel" aria-hidden="true" hidden><p>独立的曲线说明</p></div></section>
<section id="table-state" data-uip-recipe="state@1"><h2>状态面板内的筛选表格</h2><label><input type="checkbox" checked data-uip-role="control">显示表格</label><div data-uip-role="panel" aria-hidden="true" hidden><p>表格已收起</p></div><div data-uip-role="panel" aria-hidden="false"><section id="table" data-uip-recipe="table@1" data-direction="asc"><h2>本地数据 · 排序与阈值筛选</h2><label>最低值 <input type="range" min="0" max="50" step="1" value="0" data-uip-role="filter"></label><button data-uip-role="sort">切换升降序</button><output data-uip-role="output"></output><table><thead><tr><th>名称</th><th>数值</th></tr></thead><tbody data-uip-role="body"><tr><td>甲</td><td>15</td></tr><tr><td>乙</td><td>25</td></tr><tr><td>丙</td><td>40</td></tr><tr><td>丁</td><td>45</td></tr></tbody></table></section>
</div></section></main><script type="module">
import {fourierPath,tableOrder} from './recipes.js';
const chart=document.querySelector('#fourier'),c=role=>chart.querySelector(`[data-uip-role="${role}"]`);
const draw=()=>{const state=Object.fromEntries(['harmonics','amplitude','phase'].map(k=>[k,Number(c(k).value)]));c('curve').setAttribute('d',fourierPath(state));c('output').textContent=`N=${state.harmonics} · A=${state.amplitude} · φ=${state.phase}`;};chart.addEventListener('input',draw);draw();
const table=document.querySelector('#table'),t=role=>table.querySelector(`[data-uip-role="${role}"]`),rows=[...t('body').children],data=rows.map(r=>[...r.children].map(c=>c.textContent));
const update=()=>{const state={minimum:Number(t('filter').value),direction:table.dataset.direction},indices=tableOrder(data,state);rows.forEach((r,i)=>r.hidden=!indices.includes(i));t('body').replaceChildren(...indices.map(i=>rows[i]),...rows.filter((_,i)=>!indices.includes(i)));t('output').textContent=`≥${state.minimum} · ${state.direction}`;};t('filter').oninput=update;t('sort').onclick=()=>{table.dataset.direction=table.dataset.direction==='asc'?'desc':'asc';update();};update();

const tabsRoot=document.querySelector('#chart-tabs'),tabs=[...tabsRoot.querySelectorAll('[data-uip-role="tab"]')],panels=[...tabsRoot.querySelectorAll(':scope > [data-uip-role="panel"]')];
const select=i=>{tabs.forEach((tab,n)=>{tab.setAttribute('aria-selected',String(n===i));tab.tabIndex=n===i?0:-1;});panels.forEach((p,n)=>{p.hidden=n!==i;p.setAttribute('aria-hidden',String(n!==i));});};
tabs.forEach((tab,i)=>{tab.onclick=()=>select(i);tab.onkeydown=e=>{const n=e.key==='ArrowRight'?(i+1)%tabs.length:e.key==='ArrowLeft'?(i+tabs.length-1)%tabs.length:e.key==='Home'?0:e.key==='End'?tabs.length-1:null;if(n!==null){e.preventDefault();select(n);tabs[n].focus();}};});
const stateRoot=document.querySelector('#table-state'),control=stateRoot.querySelector('[data-uip-role="control"]'),statePanels=[...stateRoot.querySelectorAll(':scope > [data-uip-role="panel"]')];control.onchange=()=>statePanels.forEach((p,i)=>{p.hidden=i!==Number(control.checked);p.setAttribute('aria-hidden',String(p.hidden));});
</script></body></html>
