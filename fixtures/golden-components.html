<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Golden components · local fixture</title><style>
body{margin:32px;font:16px/1.5 system-ui;background:#f3f5f7;color:#1f2328}section{width:540px;padding:20px;background:white;border:1px solid #ccd1d8;border-radius:6px;box-sizing:border-box}.grid{display:grid;grid-template-columns:1fr 2fr;gap:12px}.value{font:24px/1.4 monospace}button{padding:8px}table{border-collapse:collapse}td{border:1px solid #888;padding:6px}@media(prefers-color-scheme:dark){body{background:#181a1e;color:#eee}section{background:#24272c}}
</style><section id="calculator"><h2>平方计算器（自有测试页）</h2><div class="grid"><label>数值 <input id="number" type="range" min="1" max="10" value="4"></label><output id="result" class="value">4² = 16</output></div><p>文本公式：E = mc<sup>2</sup>；分数 <math><mfrac><mn>1</mn><mn>2</mn></mfrac></math></p><label><input type="checkbox" checked>保留当前勾选外观</label><table><tr><td>符号</td><td>值</td></tr><tr><td>a | b</td><td>4</td></tr></table><button onclick="document.querySelector('#result').textContent='changed'">示例按钮</button></section><script>number.oninput=()=>result.textContent=`${number.value}² = ${number.value**2}`;</script></html>
