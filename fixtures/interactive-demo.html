<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UI Portability Lab 本地试验场</title><style>
body{font:16px/1.5 system-ui;color:#17212e;background:#eff3f9;margin:0;padding:30px;max-width:1000px;margin:auto}section{background:white;border-radius:16px;padding:24px;margin:22px 0;box-shadow:0 4px 18px #1b2d4110}h1{font-size:25px}h2{font-size:19px}table{width:100%;border-collapse:collapse}td,th{padding:9px 13px;border-bottom:1px solid #e2e8f0;text-align:left}svg{width:100%;height:230px;background:#f8fafc;border-radius:10px}label{display:block;margin:14px 0}input{width:100%}.note{color:#475569}
</style></head><body><h1>交互组件快照 · 本地测试</h1><p class="note">本页面用于验证浏览器扩展，不包含任何 ChatGPT 内容。</p><section id="table-demo"><h2>协议对比</h2><table><tr><th>协议</th><th>主要作用</th><th>范围</th></tr><tr><td>TCP</td><td>可靠、有序传输</td><td>传输层</td></tr><tr><td>UDP</td><td>尽力而为的数据报</td><td>传输层</td></tr></table></section><section id="wave-demo"><h2>谐波数量演示</h2><p>调节谐波数量，观察方波的傅里叶近似。</p><label>谐波数：<span id="num">3</span><input id="slider" type="range" min="1" max="15" value="3" step="2"></label><svg viewBox="0 0 720 230" xmlns="http://www.w3.org/2000/svg" id="chart"><line x1="10" y1="115" x2="710" y2="115" stroke="#94a3b8" stroke-width="1.5"/><path id="wave" fill="none" stroke="#2563eb" stroke-width="3"/></svg><button id="reset">重置</button></section><section id="security-demo"><h2>敏感内容脱敏</h2><p>密码、文本框和远程图片都不应泄露到静态快照中。</p><label>测试口令 <input type="password" value="DONT_EXPORT_ME"></label><label>测试备注 <input type="text" value="PRIVATE_NOTE_DO_NOT_EXPORT"></label><img src="https://invalid.example/token-secret.png?token=SECRET" alt="外部资源"><div style="display:none">HIDDEN_SECRET_DO_NOT_EXPORT</div><a href="javascript:alert(1)" onclick="alert(2)">不安全链接文本</a></section><script>
const slider=document.getElementById('slider');const number=document.getElementById('num');const wave=document.getElementById('wave');function render(){const n=+slider.value;number.textContent=n;let d='';for(let x=0;x<700;x+=2){const t=(x/700)*Math.PI*4;let y=0;for(let k=1;k<=n;k+=2)y+=4/Math.PI*Math.sin(k*t)/k;d+=(x?'L':'M')+(x+10)+','+(115-78*y).toFixed(2)+' ';}wave.setAttribute('d',d);}slider.addEventListener('input',render);document.getElementById('reset').addEventListener('click',()=>{slider.value=3;render()});render();
</script></body></html>
