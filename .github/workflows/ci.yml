name: Verify portable snapshots
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run package
      - run: npm run test:package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v070-verification
          path: |
            tests/artifacts/v0.4.1
            tests/artifacts/v0.5.0
            tests/artifacts/v0.7.1-installed
            tests/artifacts/v0.5.1
            tests/artifacts/v052-usability
            tests/artifacts/ui-upgrade
            tests/artifacts/v070-after
            test-results
            dist/v0.7.1
