<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>导入本地文件</title><link rel="stylesheet" href="ui.css"></head><body><header><h1>导入本地文件</h1><span class="badge">本地处理 · 不上传</span></header><main><section style="max-width:640px"><p>选择或拖入你有权保存的 HTML、SVG、JSON 快照或 PNG/JPEG/WebP 图片。</p><p>HTML/SVG 会移除脚本及外部资源。图片仅保留像素（visual-only），不能恢复语义或交互。</p><label for="file">文件（HTML/SVG/图片 ≤ 2 MB，JSON ≤ 4 MB）</label><input id="file" type="file" accept=".html,.htm,.svg,.json,.png,.jpg,.jpeg,.webp"><div id="drop" tabindex="0" style="border:1px dashed var(--line);padding:24px;margin:16px 0">拖入一个文件</div><label for="width">HTML 导入视口宽度（px）</label><input id="width" type="number" min="320" max="1600" value="1200"><div id="status" role="status" aria-live="polite">等待文件</div><p class="small">正文与图片中的敏感信息无法自动识别。下载前检查预览和遗漏。不会将文件名或本机路径写入快照。</p></section><div id="sandbox"></div></main><script type="module" src="import.js"></script></body></html>
