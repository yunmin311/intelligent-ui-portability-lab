<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="ui.css"><title>UI Portability Lab</title></head><body class="popup">
<div class="brand"><span class="capture-mark" aria-hidden="true"></span><span translate="no">UI Portability Lab</span><span class="local-label">本地工具</span></div>
<h1>保存你看到的界面</h1><p class="intro">复制内容或截取画面，回到这里保存。</p>
<button class="primary action-import" id="import">手动粘贴 / 导入文件 <span aria-hidden="true">↗</span></button>
<p class="action-hint">截图、富文本、纯文本，或已有快照</p>
<div class="divider-label">也可以捕获当前网页</div>
<button id="choose">选择页面区域 <span aria-hidden="true">→</span></button>
<details class="capture-settings"><summary>页面捕获设置</summary><label for="format">默认导出格式</label><select id="format"><option value="html">HTML · 单页网页</option><option value="md">Markdown · 笔记文本</option><option value="json">JSON · 备份文件</option><option value="svg">SVG · 仅 SVG 图形</option><option value="png">PNG · 仅图形图片</option><option value="zip">ZIP · 完整离线包</option></select><label class="check-row" for="controlledSource"><input id="controlledSource" type="checkbox">受控组件恢复（高级）</label><p class="small">仅在自建的受支持页面开启；未知网站不会因此获得交互恢复。</p></details>
<div id="status" role="status" aria-live="polite">检查当前页面…</div><p class="small privacy-note">内容留在本机。ChatGPT 自动提取停用，请手动复制或截图后粘贴。未知交互静态保存。</p><script src="popup.js"></script></body></html>
