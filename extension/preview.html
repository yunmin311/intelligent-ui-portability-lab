<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>快照预览</title><link rel="stylesheet" href="ui.css"></head>
<body class="preview"><a class="skip-link" href="#viewport">跳到内容预览</a>
<header>
<div class="preview-heading"><div class="brand"><span class="capture-mark" aria-hidden="true"></span><h1>快照预览</h1></div><span id="capability" class="badge">static · 不含原始交互</span></div>
<div class="toolbar"><div class="toolbar-settings"><div class="field"><label for="strategy">交互恢复</label><select id="strategy"><option value="auto">自动（推荐）</option><option value="interactive">尽量恢复交互（降级需确认）</option><option value="static">全部静态</option></select></div><div class="field"><label for="format">导出格式</label><select id="format"><option value="html">HTML · 单页网页</option><option value="md">Markdown · 笔记文本</option><option value="json">JSON · 备份 / 可再次导入</option><option value="svg">SVG · 仅 SVG 图形</option><option value="png">PNG · 仅图形 / 图片</option><option value="zip">ZIP · 完整离线包</option></select></div></div>
<div class="toolbar-actions"><button id="save" class="primary" disabled>下载文件</button></div></div>
<label id="degradationLabel" class="check-row" hidden><input id="confirmDegradation" type="checkbox">我已查看不可恢复组件，确认将它们静态保存</label><p id="formatHelp" class="small">HTML 保留外观；ZIP 同时保存网页、笔记与资源；JSON 用于再次导入。</p><span id="message" role="status" aria-live="polite">正在读取快照…</span>
</header>
<main class="preview-workspace"><section class="preview-stage" aria-label="原始内容预览"><div class="surface-heading"><h2>内容预览</h2><span>保留来源外观 · 可滚动查看</span></div><div class="preview-controls"><label for="previewScale">预览缩放</label><select id="previewScale"><option value="fit">适应窗口</option><option value="0.25">25%</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select><output id="scaleValue" for="previewScale" aria-live="polite"></output></div><p class="small preview-hint">仅缩放预览，不改变导出尺寸；适应窗口按宽度缩放，长内容可纵向滚动。</p><p id="qualityNotice" class="quality-notice" hidden></p><div id="viewport" tabindex="0" aria-label="来源内容画布"></div></section><aside class="inspector"><div class="surface-heading"><h2>保存检查</h2><span>能力与差异</span></div><section id="report" aria-label="快照与交互报告" tabindex="0"></section><button id="saveReport" disabled>下载遗漏报告</button><p class="small">报告只包含诊断，不包含快照正文。</p></aside></main><script type="module" src="preview.js"></script></body></html>
