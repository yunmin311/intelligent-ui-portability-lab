<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>快照预览</title><link rel="stylesheet" href="ui.css"></head>
<body class="preview"><a class="skip-link" href="#viewport">跳到内容预览</a>
<header>
<div class="preview-heading"><div class="brand"><span class="capture-mark" aria-hidden="true"></span><h1>快照预览</h1></div><span id="capability" class="badge">static · 不含原始交互</span></div>
<div class="toolbar"><div class="toolbar-settings"><div class="field"><label for="strategy">交互策略</label><select id="strategy"><option value="auto">Auto · 自动逐组件</option><option value="interactive">Interactive · 优先交互，降级需确认</option><option value="static">Static · 静态</option></select></div><div class="field"><label for="format">导出格式</label><select id="format"><option value="html">HTML</option><option value="md">Markdown</option><option value="json">JSON · 完整快照</option><option value="svg">SVG</option><option value="png">PNG</option><option value="zip">ZIP</option></select></div></div>
<div class="toolbar-actions"><button id="save" class="primary" disabled>下载文件</button></div></div>
<label id="degradationLabel" class="check-row" hidden><input id="confirmDegradation" type="checkbox">我已查看不可恢复组件，确认将它们静态保存</label><span id="message" role="status" aria-live="polite">正在读取快照…</span>
</header>
<main class="preview-workspace"><section class="preview-stage" aria-label="原始内容预览"><div class="surface-heading"><h2>内容预览</h2><span>保留来源外观 · 可滚动查看</span></div><div id="viewport" tabindex="0" aria-label="来源内容画布"></div></section><aside class="inspector"><div class="surface-heading"><h2>保存检查</h2><span>能力与差异</span></div><section id="report" aria-label="快照与交互报告" tabindex="0"></section><button id="saveReport" disabled>下载遗漏报告</button><p class="small">报告只包含诊断，不包含快照正文。</p></aside></main><script type="module" src="preview.js"></script></body></html>
